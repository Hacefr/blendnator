<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Anim Studio - Step 2</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load Three.js, OrbitControls, and TransformControls (for the 3D Gizmo) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="add-r6">Spawn R6 Rig</button>
            <button id="add-prop">Spawn Sword</button>
            <div class="divider"></div>
            <!-- Transform Tools -->
            <button id="tool-translate">Move Tool (T)</button>
            <button id="tool-rotate">Rotate Tool (R)</button>
            <div class="divider"></div>
            <button id="weld-btn" style="background: #007acc;">Weld Sword to Right Arm</button>
            <span id="selected-text">Selected: None</span>
        </div>

        <div id="main-area">
            <div id="viewport"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
